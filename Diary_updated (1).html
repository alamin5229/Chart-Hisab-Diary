:root{--desk:#2b2118;--desk2:#1d1610;--paper:#fbf6e9;--paper-edge:#efe5cb;--rule:#b9cde0;--margin:#c9564a;--ink:#1c2b4a;--pen:#1d3f9c;--faint:#7d8aa3;--gold:#9a7b2f;
--serif:"OpenFour","CrossSeven","Libre Baskerville",Georgia,"Times New Roman",serif;--hand:"OpenFour","CrossSeven","Caveat","Segoe Print","Bradley Hand","Noteworthy","Comic Sans MS",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#16110c;--desk2:#0d0a07}}
:root[data-theme="dark"]{--desk:#16110c;--desk2:#0d0a07}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--desk2);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{position:relative;background:radial-gradient(120% 80% at 50% 0%,var(--desk),var(--desk2));min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--serif);overflow-x:hidden}
button{touch-action:manipulation}
.page{position:relative;z-index:1;max-width:560px;min-height:100vh;min-height:100dvh;margin:0 auto;background:radial-gradient(90% 34% at 50% 0%,#fffaf0d0,transparent 72%),linear-gradient(90deg,var(--paper-edge),var(--paper) 36px,var(--paper));box-shadow:0 0 40px #000a;padding:2px 8px 40px 60px;overflow:hidden;animation:paperglow 6s ease-in-out infinite alternate}
body.kb .page{padding-bottom:360px}
.page::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:22px;background:radial-gradient(circle at 11px 11px,var(--desk2) 0 6px,#0004 6.5px 8px,transparent 8.5px) 0 14px/22px 56px repeat-y}
.page::after{content:"";position:absolute;left:48px;top:0;bottom:0;width:3px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);opacity:.55}
/* page-turn (was being overridden by paperglow before; fixed with higher specificity) */
.page.flip{animation:flip .38s ease-out,paperglow 6s ease-in-out infinite alternate}
@keyframes flip{from{opacity:0;transform:translateX(22px) rotate(.5deg)}to{opacity:1;transform:none}}
.orn{position:absolute;top:-6px;right:0;width:122px;height:86px;pointer-events:none;animation:orn 8s ease-in-out infinite alternate}
.top{position:relative;min-height:62px;padding-right:112px;margin-bottom:0}
.meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.date{color:var(--faint);font-style:italic;font-size:.78rem}
.nav{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:.78rem;white-space:nowrap}
.nav b{color:var(--gold)}
.arrow{font:inherit;font-size:1rem;line-height:1;width:26px;height:24px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:5px;cursor:pointer;padding:0}
.arrow:disabled{opacity:.3;cursor:default}
.cols,.row,.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 28px;align-items:end;column-gap:0}
.cols{position:relative;color:var(--faint);font-size:.85rem;padding-bottom:2px}
.cols span{text-align:center}
.cols .m{grid-column:span 2;font-size:1.05rem;color:var(--ink)}
.cols .no{text-align:right}
.pop{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
.row,.addrow{position:relative;height:52px;border-bottom:1px solid var(--rule)}
.row{transition:background .35s}
.row:hover{background:linear-gradient(90deg,#9a7b2f1c,transparent 70%)}
.no{position:absolute;left:-40px;width:28px;bottom:6px;text-align:right;font-size:.95rem;line-height:1.5;color:var(--margin)}
#nextno{opacity:.45}
.c{align-self:stretch;display:flex;align-items:flex-end;border-left:1.5px solid #3a3040;padding:0 4px 6px;min-width:0}
.c>*{width:100%}
.fr,.to{font-size:1.2rem;line-height:1.4;white-space:nowrap;text-align:center}
.amt{font:inherit;font-size:1.2rem;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:0 2px;line-height:1.4;text-align:center;min-width:0;-webkit-appearance:none;appearance:none;transition:border-color .3s,background .3s,box-shadow .3s}
.amt:hover{border-bottom-color:var(--rule)}
.amt:focus{outline:0;border-bottom:1.5px solid var(--gold);background:#9a7b2f12;box-shadow:0 6px 14px -8px #9a7b2fcc}
.amt::placeholder{color:#a9b3c6;font-style:italic;font-size:.85rem}
.del{border:0;background:transparent;color:var(--faint);font-size:1.2rem;line-height:1;cursor:pointer;padding:4px 0;opacity:.7;border-left:1.5px solid #3a3040;align-self:stretch}
.del:hover{color:var(--margin);opacity:1}
.ok{align-self:center;justify-self:center;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#f6ecd0;font:inherit;font-size:.9rem;line-height:1;cursor:pointer;padding:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,filter .3s}
.ok:hover{transform:scale(1.12);box-shadow:0 0 14px 3px #9a7b2f88;filter:brightness(1.1)}
.ok:active{transform:scale(.86) rotate(-8deg)}
.addrow{background:linear-gradient(100deg,transparent 35%,#9a7b2f1f 50%,transparent 65%) 0 0/250% 100% no-repeat;animation:sweep 5.5s ease-in-out infinite}
.hand{border-top:1.5px solid #3a3040}
.hl{height:52px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;padding:0 10px 3px 4px;font-family:var(--hand);font-weight:600;font-size:2rem;line-height:1;color:var(--pen);white-space:nowrap;overflow:hidden}
.hl.r{justify-content:flex-end;padding-right:18px}
.hl.mul{border-bottom:2.5px solid var(--pen)}
.dbl{border-bottom:4px double var(--pen);padding:0 6px}
.oval{font-style:normal;border:2.5px solid var(--pen);border-radius:58% 42% 55% 45% / 50% 58% 42% 50%;padding:0 16px 2px;transform:rotate(-2deg)}
.wavy{text-decoration:underline wavy var(--gold);text-underline-offset:5px;margin-left:8px}
.spark{color:var(--gold);font-size:1.1rem;margin-right:8px;font-family:serif}
.arr{color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.link{font:inherit;font-family:"Galada",var(--serif);font-size:1rem;color:var(--faint);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 0;transition:color .25s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.link:hover{transform:translateY(-2px);color:var(--gold)}
.link:active{transform:scale(.93)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.chip{font:inherit;font-family:"Galada",var(--serif);font-size:.95rem;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer;transition:color .25s,transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px #9a7b2f40}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--ink);color:#f6ecd0}
.cust{width:80px;font-size:1rem;border-bottom:1.5px solid var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* foil text only where background-clip:text is supported (otherwise plain colour = never invisible) */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
.date{background:linear-gradient(100deg,var(--faint) 30%,var(--gold) 50%,var(--faint) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:foil 7s ease-in-out infinite}
.nav b{background:linear-gradient(100deg,#7a5f1c,#e6c46a 45%,#7a5f1c 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:foil 5s ease-in-out infinite}
}
.arrow{transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,border-color .25s,background .25s}
.arrow:not(:disabled):hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 4px 12px #9a7b2f40;background:#9a7b2f12}
.arrow:not(:disabled):active{transform:scale(.88)}
/* ambient lamp + floating motes: GPU transform animations only (no repaint, no blend-mode) */
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 50% 8%,#ffb85a38,transparent 70%);animation:lamp 9s ease-in-out infinite alternate;will-change:transform,opacity}
body::after{content:"";position:fixed;left:0;top:0;width:100%;height:calc(100% + 300px);pointer-events:none;z-index:2;opacity:.6;
background:radial-gradient(circle,#ffd98a 0 1.2px,transparent 2px) 0 0/190px 300px,radial-gradient(circle,#fff1c9 0 1px,transparent 2px) 70px 90px/260px 300px,radial-gradient(circle,#ffd98a 0 1.4px,transparent 2.4px) 130px 40px/330px 300px;
animation:motes 38s linear infinite;will-change:transform}
